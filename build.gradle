plugins {
    id 'base'
    id 'com.github.breadmoirai.github-release' version '2.5.2'
}

// Версия релиза (git-тег и имя релиза) из settings.gradle
version = gradle.ext.releaseVersion

def buildsDirectory = layout.projectDirectory.dir('builds')
def authlibProjects = subprojects.findAll { it.name.startsWith('Authlib-') }

ext.authlibManifestAttributes = [
    'Add-Exports': [
        'java.base/java.lang', 'java.base/java.lang.annotation', 'java.base/java.lang.invoke',
        'java.base/java.lang.ref', 'java.base/java.lang.reflect', 'java.base/java.io',
        'java.base/java.math', 'java.base/java.net', 'java.base/java.nio',
        'java.base/java.nio.channels', 'java.base/java.nio.charset', 'java.base/java.nio.file',
        'java.base/java.security', 'java.base/java.security.cert', 'java.base/java.text',
        'java.base/java.time', 'java.base/java.time.format', 'java.base/java.util',
        'java.base/java.util.concurrent', 'java.base/java.util.concurrent.atomic',
        'java.base/java.util.concurrent.locks', 'java.base/java.util.function',
        'java.base/java.util.jar', 'java.base/java.util.regex', 'java.base/java.util.stream',
        'java.base/java.util.zip', 'java.base/jdk.internal.access', 'java.base/jdk.internal.loader',
        'java.base/jdk.internal.misc', 'java.base/jdk.internal.platform', 'java.base/jdk.internal.reflect',
        'java.base/jdk.internal.util', 'java.base/jdk.internal.vm', 'java.base/jdk.internal.vm.annotation',
        'java.base/sun.invoke.util', 'java.base/sun.net.util', 'java.base/sun.net.www',
        'java.base/sun.net.www.protocol.file', 'java.base/sun.net.www.protocol.http',
        'java.base/sun.net.www.protocol.https', 'java.base/sun.net.www.protocol.jar',
        'java.base/sun.nio.ch', 'java.base/sun.nio.cs',
        'java.base/sun.reflect.generics.reflectiveObjects', 'java.base/sun.security.action',
        'java.base/sun.security.pkcs', 'java.base/sun.security.provider', 'java.base/sun.security.rsa',
        'java.base/sun.security.util', 'java.base/sun.security.x509', 'java.base/sun.util.calendar',
        'jdk.unsupported/sun.misc', 'jdk.unsupported/sun.reflect',
        'java.logging/java.util.logging', 'java.desktop/java.awt', 'java.desktop/sun.awt',
        'java.desktop/sun.font'
    ].join(' '),
    'Add-Opens': null,
    'Enable-Native-Access': 'ALL-UNNAMED',
    'Main-Class': 'team.luxinfine.authlib.boot.ServerEntrypoint',
    'Agent-Class': 'team.luxinfine.authlib.boot.AuthlibAgent',
    'Launcher-Agent-Class': 'team.luxinfine.authlib.boot.AuthlibAgent',
    'Premain-Class': 'team.luxinfine.authlib.boot.AuthlibAgent',
    'Can-Retransform-Classes': 'true'
]
ext.authlibManifestAttributes['Add-Opens'] = ext.authlibManifestAttributes['Add-Exports']

subprojects {
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute(module('team.luxinfine:AuthlibCommonAPI')).using(project(':AuthlibCommonAPI'))
        }
    }
}

// Собираем client/server-версии всех патчей в одну папку builds/
tasks.register('collectBuilds', Sync) {
    group = 'build'
    description = 'Копирует собранные client/server JAR-ы всех версий в builds/'
    into(buildsDirectory)
    dependsOn { authlibProjects.collect { it.tasks.named('buildAll') } }
    authlibProjects.each { authlibProject ->
        from(authlibProject.layout.buildDirectory.dir('libs')) {
            include '*-client.jar'
            include '*-server.jar'
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Собирает client/server JAR-ы всех проектов Authlib-*'
    dependsOn tasks.named('collectBuilds')
}

// ---------------------------------------------------------------------------
// Публикация релиза на GitHub
// ---------------------------------------------------------------------------

// Владелец и репозиторий берутся из подключённого git remote origin,
// чтобы не хардкодить их в скрипте
def parseGithubRemote = { String url ->
    def matcher = url =~ 'github\\.com[/:]([^/]+)/([^/]+?)(?:\\.git)?$'
    matcher.find() ? [owner: matcher.group(1), repo: matcher.group(2)] : null
}

def runGit = { List<String> args ->
    providers.exec {
        commandLine(['git'] + args)
        workingDir rootDir
        ignoreExitValue = true
    }.standardOutput.asText.get().trim()
}

def originUrl = runGit(['remote', 'get-url', 'origin'])
def githubRemote = parseGithubRemote(originUrl)
if (githubRemote == null) {
    throw new GradleException("Не удалось определить GitHub-репозиторий из remote origin: '${originUrl}'")
}

def githubToken = gradle.ext.githubToken

// Тег создаётся от текущей ветки подключённого репозитория (или от HEAD,
// если рабочая копия в detached state)
def currentBranch = runGit(['rev-parse', '--abbrev-ref', 'HEAD'])
def targetCommitishValue = (currentBranch && currentBranch != 'HEAD')
    ? currentBranch
    : runGit(['rev-parse', 'HEAD'])

githubRelease {
    owner = githubRemote.owner
    repo = githubRemote.repo
    token = githubToken ?: ''
    tagName = version.toString()
    releaseName = "Authlib ${version}"
    targetCommitish = targetCommitishValue
    generateReleaseNotes = false
    body = 'Сборки патченных версий Mojang Authlib.'
    draft = false
    prerelease = false
    overwrite = true
    dryRun = providers.gradleProperty('dryRun').map { it.toBoolean() }.getOrElse(false)
    releaseAssets = fileTree(buildsDirectory.asFile) { include '*.jar' }
}

tasks.named('githubRelease') {
    group = 'publishing'
    description = 'Собирает все версии Authlib и публикует JAR-ы в GitHub Release'
    dependsOn tasks.named('buildAll')
    doFirst {
        if (!githubToken) {
            throw new GradleException("GitHub-токен не найден")
        }
    }
}
