plugins {
    id 'java'
}

group = 'team.luxinfine'
version = '1.0.0'
base {
    archivesName = 'AuthlibCommonAPI'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
    options.release = 8
}

repositories {
    maven { url 'https://jitpack.io' }
    mavenCentral()
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:1.3.9'
    compileOnly 'com.github.LuxinfineTeam:JarSplitterGradle:api-1.7.10-SNAPSHOT'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Boot-класс NativeAPI не должен попадать ни в один authlib jar
    exclude 'team/luxinfine/rslauncher/client/NativeAPI.class'
}
