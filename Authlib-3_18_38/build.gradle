buildscript {
    repositories {
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath "com.github.LuxinfineTeam:JarSplitterGradle:plugin-SNAPSHOT"
    }
}


plugins {
    id 'java'
}
apply plugin: 'team.luxinfine.jarsplitter'

group = 'team.luxinfine'
version = authlibVersion
base {
    archivesName = 'authlib'
}

repositories {
    maven {
        name = 'MojangLibraries'
        url = 'https://libraries.minecraft.net'
    }
    maven { url 'https://jitpack.io' }
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.incremental = false
    options.release = 17
}

def authlibOriginalConfig = configurations.create('originalAuthlib') {
    transitive = false
    canBeResolved = true
    canBeConsumed = false
}

dependencies {
    compileOnly "com.mojang:authlib:$authlibVersion"
    originalAuthlib "com.mojang:authlib:$authlibVersion"

    compileOnly 'com.google.guava:guava:17.0'
    compileOnly 'org.apache.commons:commons-lang3:3.3.2'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.0-beta9'
    compileOnly 'org.apache.logging.log4j:log4j-core:2.0-beta9'
    compileOnly 'commons-codec:commons-codec:1.9'
    compileOnly 'com.google.code.gson:gson:2.2.4'
    compileOnly 'commons-io:commons-io:2.4'
    compileOnly 'com.google.code.findbugs:jsr305:1.3.9'

    compileOnly 'com.github.LuxinfineTeam:JarSplitterGradle:api-1.7.10-SNAPSHOT'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(authlibOriginalConfig.singleFile) }
    exclude '/yggdrasil_session_pubkey.der'
}


